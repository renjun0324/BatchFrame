<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BatchFrame V3 UI concepts</title>
  <link rel="stylesheet" href="prototype.css" />
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">BATCHFRAME / V3 CONCEPTS</p>
      <h1>一套信息架构，两种材料气质</h1>
      <p>本原型只用于视觉评审。生产页面仍保持不变。</p>
    </header>
    <section class="directions">
      <article class="phone darkroom">
        <div class="nav"><span>BATCHFRAME</span><small>PHOTO WORKBENCH</small></div>
        <div class="stage"><div class="mat"><div class="photo"></div></div></div>
        <div class="thumbs"><i></i><i class="selected"></i><span>＋ 添加</span></div>
        <nav><a class="active">▣<b>模板</b></a><a>□<b>画布</b></a><a>▧<b>内框</b></a><a>▣<b>图片</b></a></nav>
        <div class="sheet"><h2>内框风格</h2><div class="cards"><div>全幅扫描</div><div>片门压框</div><div>35mm 负片</div></div><div class="slider">边缘强度　　轻　 <strong>标准</strong>　 明显</div></div>
        <button class="export">导出 2 张</button>
      </article>
      <article class="phone gallery">
        <div class="nav"><span>BATCHFRAME</span><small>GALLERY MOUNT</small></div>
        <div class="stage"><div class="mat"><div class="photo"></div></div></div>
        <div class="thumbs"><i></i><i class="selected"></i><span>＋ 添加</span></div>
        <nav><a class="active">▣<b>模板</b></a><a>□<b>画布</b></a><a>▧<b>内框</b></a><a>▣<b>图片</b></a></nav>
        <div class="sheet"><h2>画布比例与留白</h2><div class="chips"><b>1:1</b><b class="selected">4:5</b><b>3:4</b><b>9:16</b></div><p>外层背景　 ○ 暖白　 ● 深黑　 ○ 沙色</p></div>
        <button class="export">导出 2 张</button>
      </article>
    </section>
  </main>
</body>
</html>
